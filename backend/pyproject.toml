[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riz"
version = "0.1.0"
description = "Riz, a local Windows desktop AI agent"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langchain-ollama>=1.2.0",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "send2trash>=2.2.0",
    "pywebview>=6.2.1",
    "pystray>=0.19.5",
    "keyboard>=0.13.5",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0", "ruff>=0.17.6"]

[tool.setuptools]
packages = ["riz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
